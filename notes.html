<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="description" content="Six colourful boxes for tasks, thoughts, plans and reminders.">
<title>Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --ink:#141625;
  --soft:#6B7185;
  --faint:#A8AEC0;
  --glass:rgba(255,255,255,.58);
  --edge:rgba(255,255,255,.85);
  --solid:#FFFFFF;
  --hair:rgba(20,22,37,.09);
  --hover:rgba(20,22,37,.05);
  --auraop:.5;
  --ease:cubic-bezier(.32,.72,0,1);
  --hi:#FF3B5C; --mid:#FF9500; --lo:#22C55E;
}
html[data-theme="dark"]{
  --bg:#0B0D14;
  --ink:#ECEEF6;
  --soft:#8C94AA;
  --faint:#5C6379;
  --glass:rgba(255,255,255,.055);
  --edge:rgba(255,255,255,.10);
  --solid:#161926;
  --hair:rgba(255,255,255,.10);
  --hover:rgba(255,255,255,.07);
  --auraop:.32;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--ink);
  overflow-x:hidden;transition:background .3s;}
svg{display:block;flex-shrink:0;}
button{font:inherit;color:inherit;}
input,select,textarea{font:inherit;}
:focus-visible{outline:2.5px solid #3B82F6;outline-offset:2px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ---------- ambient liquid ---------- */
.aura{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:var(--auraop);
  animation:drift 18s ease-in-out infinite alternate;}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1);}to{transform:translate3d(14px,-22px,0) scale(1.12);}}

.shell{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 20px 120px;min-height:100dvh;}

/* ---------- home header ---------- */
.top{padding:calc(30px + env(safe-area-inset-top)) 2px 16px;display:flex;align-items:flex-start;gap:8px;}
.hello{font-family:'Outfit',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.03em;line-height:1.04;}
.date{font-size:12.5px;color:var(--soft);font-weight:500;margin-top:6px;}
.grow{flex:1;}
.ghost{background:var(--glass);border:1px solid var(--edge);border-radius:13px;width:38px;height:38px;
  display:grid;place-items:center;color:var(--soft);cursor:pointer;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 14px rgba(20,22,37,.06);
  transition:transform .2s var(--ease),color .2s;flex-shrink:0;}
.ghost:hover{transform:scale(1.07);color:var(--ink);}

/* ---------- dashboard ---------- */
.dash{background:var(--glass);border:1px solid var(--edge);border-radius:22px;padding:4px 6px;margin-bottom:16px;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 8px 26px -16px rgba(20,22,37,.4);overflow:hidden;}
.dashbar{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;background:none;border:0;width:100%;text-align:left;}
.dashttl{font-family:'Outfit',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:-.01em;}
.dashmini{font-size:11.5px;color:var(--soft);font-weight:600;}
.chev{color:var(--faint);transition:transform .34s var(--ease);}
.dash.open .chev{transform:rotate(180deg);}
.dashgrid{display:none;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 8px 12px;}
.dash.open .dashgrid{display:grid;animation:fadein .35s var(--ease);}
@keyframes fadein{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.stat{background:var(--hover);border:0;border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer;
  transition:transform .2s var(--ease);}
.stat:hover{transform:translateY(-2px);}
.statn{font-family:'Outfit',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1;}
.statl{font-size:9.5px;color:var(--soft);font-weight:600;margin-top:4px;letter-spacing:.01em;}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tile{position:relative;overflow:hidden;text-align:left;cursor:pointer;aspect-ratio:1/1.02;border-radius:26px;padding:16px;
  background:var(--glass);border:1px solid var(--edge);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:0 10px 30px -12px var(--shadow), inset 0 1px 0 rgba(255,255,255,.55);
  display:flex;flex-direction:column;transition:transform .34s var(--ease),box-shadow .34s var(--ease);
  opacity:1;transform:none;}
/* The entrance animation is an enhancement only, never a condition for being visible.
   If motion is reduced the tiles simply appear — they must never stay at opacity 0. */
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:no-preference){
  html:not([data-reduce="1"]) .tile{animation:pop .55s var(--ease) both;}
}
.tile::before{content:'';position:absolute;right:-38%;top:-38%;width:110%;height:110%;border-radius:50%;
  background:var(--grad);opacity:.24;filter:blur(18px);transition:transform .5s var(--ease),opacity .4s;}
.tile:hover{transform:translateY(-4px);box-shadow:0 20px 40px -14px var(--shadow), inset 0 1px 0 rgba(255,255,255,.55);}
.tile:hover::before{transform:scale(1.22) translate(-6%,8%);opacity:.34;}
.tile:active{transform:scale(.965);}
.tico{position:relative;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  color:#fff;background:var(--grad);box-shadow:0 6px 16px -4px var(--shadow);}
.talert{position:absolute;top:14px;right:14px;display:flex;gap:5px;}
.pipa{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2.5px var(--bg);}
.tname{position:relative;font-family:'Outfit',sans-serif;font-weight:600;font-size:16.5px;letter-spacing:-.02em;
  line-height:1.2;margin-top:auto;}
.tnum{position:relative;display:flex;align-items:baseline;gap:6px;margin-top:6px;}
.tbig{font-family:'Outfit',sans-serif;font-weight:700;font-size:30px;line-height:.95;letter-spacing:-.035em;
  color:var(--tint);}
.tlbl{font-size:11px;font-weight:600;color:var(--soft);}

/* ---------- panels ---------- */
.panel{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .46s var(--ease);visibility:hidden;}
.panel.on{transform:none;visibility:visible;}
.phead{position:relative;overflow:hidden;background:var(--grad);color:#fff;flex-shrink:0;
  padding:calc(16px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 28px 28px;
  box-shadow:0 12px 34px -18px var(--shadow);}
.phead::after{content:'';position:absolute;right:-60px;top:-90px;width:230px;height:230px;border-radius:50%;
  background:rgba(255,255,255,.16);}
.phead .inner{max-width:560px;margin:0 auto;position:relative;}
.prow{display:flex;align-items:center;gap:8px;}
.back{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:12px;width:38px;height:38px;
  display:grid;place-items:center;color:#fff;cursor:pointer;transition:background .2s,transform .2s var(--ease);flex-shrink:0;}
.back:hover{background:rgba(255,255,255,.32);}
.ptitle{font-family:'Outfit',sans-serif;font-weight:700;font-size:25px;letter-spacing:-.03em;margin-top:14px;}
.psub{font-size:12.5px;font-weight:500;opacity:.88;margin-top:4px;}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pinner{max-width:560px;margin:0 auto;padding:14px 20px 140px;}

/* ---------- filter chips ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 20px 10px;margin:0 -20px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fchip{flex-shrink:0;border:1px solid var(--hair);background:var(--glass);border-radius:99px;padding:7px 13px;
  font-size:12px;font-weight:600;color:var(--soft);cursor:pointer;white-space:nowrap;
  transition:all .2s var(--ease);backdrop-filter:blur(10px);}
.fchip:hover{color:var(--ink);}
.fchip.on{background:var(--grad2,var(--ink));color:var(--bg);border-color:transparent;}
html[data-theme="dark"] .fchip.on{color:#0B0D14;background:#ECEEF6;}

/* ---------- notes ---------- */
ul.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.note{position:relative;display:flex;gap:11px;padding:13px 12px 13px 10px;border-radius:20px;
  background:var(--glass);border:1px solid var(--edge);
  backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  box-shadow:0 8px 24px -14px var(--shadow);animation:slidein .4s var(--ease);
  transition:opacity .3s,box-shadow .25s,transform .2s var(--ease);}
@keyframes slidein{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:none;}}
.note.done{opacity:.45;}
.note.done .ntext{text-decoration:line-through;}
.note.over{border-color:rgba(255,59,92,.45);box-shadow:0 8px 24px -14px rgba(255,59,92,.5);}
.note.dragging{z-index:5;box-shadow:0 22px 44px -12px rgba(20,22,37,.4);transition:none;cursor:grabbing;}
.note.flash{animation:flash 1.5s var(--ease);}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--tint);}100%{box-shadow:0 8px 24px -14px var(--shadow);}}
.grip{flex-shrink:0;width:20px;display:flex;align-items:center;justify-content:center;color:var(--faint);
  cursor:grab;touch-action:none;align-self:stretch;border:0;background:none;padding:0;border-radius:6px;}
.grip:hover{color:var(--soft);}
.tick{flex-shrink:0;width:24px;height:24px;border-radius:8px;border:2px solid var(--hair);background:none;cursor:pointer;
  display:grid;place-items:center;color:transparent;margin-top:2px;transition:all .22s var(--ease);}
.tick:hover{border-color:var(--tint);}
.tick.on{background:var(--grad);border-color:transparent;color:#fff;}
.num{flex-shrink:0;min-width:24px;height:24px;padding:0 5px;border-radius:8px;display:grid;place-items:center;
  font-family:'Outfit',sans-serif;font-weight:600;font-size:12px;color:#fff;background:var(--grad);
  box-shadow:0 4px 10px -3px var(--shadow);margin-top:2px;}
.nbody{flex:1;min-width:0;}
.ntext{margin:0;font-size:14.8px;line-height:1.5;white-space:pre-wrap;word-break:break-word;cursor:text;
  font-weight:500;outline:none;}
.nedit{width:100%;background:var(--solid);border:1.5px solid var(--tint);border-radius:12px;padding:9px 11px;
  font:inherit;font-size:14.8px;font-weight:500;line-height:1.5;resize:vertical;min-height:82px;outline:none;color:var(--ink);}
.nmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;}
.mchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;
  border-radius:99px;background:var(--hover);color:var(--soft);letter-spacing:.01em;}
.mchip.pri{color:#fff;}
.mchip.due{background:rgba(59,130,246,.12);color:#3B82F6;}
.mchip.today{background:rgba(255,149,0,.14);color:#D97706;}
.mchip.over{background:rgba(255,59,92,.13);color:#FF3B5C;}
.mchip.streak{background:rgba(255,149,0,.14);color:#D97706;}
.pdot{width:7px;height:7px;border-radius:50%;}
.nfoot{display:flex;align-items:center;gap:4px;margin-top:8px;}
.stampx{font-size:10.5px;color:var(--faint);font-weight:600;}
.ico{background:none;border:0;color:var(--faint);cursor:pointer;padding:5px;border-radius:9px;display:flex;
  transition:color .2s,background .2s,transform .2s var(--ease);}
.ico:hover{color:var(--ink);background:var(--hover);transform:scale(1.08);}
.ico.del:hover{color:#FF3B5C;background:rgba(255,59,92,.09);}

.blank{text-align:center;padding:52px 24px;}
.blankico{width:64px;height:64px;border-radius:22px;margin:0 auto 16px;display:grid;place-items:center;
  color:#fff;background:var(--grad);opacity:.9;box-shadow:0 12px 26px -10px var(--shadow);
  animation:float 3.4s ease-in-out infinite alternate;}
@keyframes float{to{transform:translateY(-7px);}}
.blank h3{font-family:'Outfit',sans-serif;font-weight:600;font-size:18px;margin:0 0 6px;letter-spacing:-.02em;}
.blank p{margin:0;font-size:13.5px;color:var(--soft);line-height:1.55;}

/* ---------- banner (rollover / reminder) ---------- */
.banner{background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:14px 15px;margin-bottom:14px;
  backdrop-filter:blur(18px);box-shadow:0 8px 24px -16px rgba(20,22,37,.4);animation:slidein .4s var(--ease);}
.bttl{font-family:'Outfit',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:-.01em;}
.bsub{font-size:12.5px;color:var(--soft);margin-top:3px;line-height:1.5;}
.bacts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;}
.bbtn{border:1px solid var(--hair);background:none;border-radius:11px;padding:8px 12px;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .2s var(--ease);}
.bbtn:hover{border-color:var(--tint);color:var(--tint);}
.bbtn.pri{background:var(--grad);color:#fff;border-color:transparent;}

/* ---------- FAB ---------- */
.fab{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:30;display:none;align-items:center;gap:9px;padding:15px 26px 15px 21px;border:0;border-radius:99px;
  background:var(--grad);color:#fff;font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;
  letter-spacing:-.01em;cursor:pointer;box-shadow:0 14px 32px -8px var(--shadow);
  transition:transform .28s var(--ease);}
.fab.on{display:flex;animation:fabin .42s var(--ease);}
@keyframes fabin{from{opacity:0;transform:translateX(-50%) translateY(22px) scale(.9);}to{opacity:1;transform:translateX(-50%);}}
.fab:hover{transform:translateX(-50%) translateY(-3px) scale(1.03);}
.fab:active{transform:translateX(-50%) scale(.96);}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.34);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .34s var(--ease),visibility .34s;}
.scrim.on{opacity:1;visibility:visible;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(110%);
  transition:transform .44s var(--ease);max-height:92dvh;display:flex;}
.sheet.on{transform:none;}
.sheetin{width:100%;max-width:560px;margin:0 auto;background:var(--solid);
  border-radius:30px 30px 0 0;border-top:1px solid var(--edge);
  padding:12px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -20px rgba(10,12,20,.35);
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.handle{width:42px;height:4.5px;border-radius:99px;background:var(--hair);margin:0 auto 14px;flex-shrink:0;}
.shead{font-family:'Outfit',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.02em;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;}
.lbl{font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.04em;text-transform:uppercase;margin:16px 0 8px;}
.compose{width:100%;min-height:96px;max-height:200px;border-radius:18px;border:1.5px solid var(--hair);
  background:var(--bg);padding:14px;font-size:15px;font-weight:500;line-height:1.55;resize:none;outline:none;color:var(--ink);
  transition:border-color .2s,box-shadow .2s;}
.compose:focus{border-color:var(--tint);box-shadow:0 0 0 4px var(--halo);}
.compose::placeholder{color:var(--faint);font-weight:400;}
.hint{font-size:11.5px;color:var(--soft);margin:8px 2px 0;font-weight:500;line-height:1.5;}
.opts{display:flex;gap:7px;flex-wrap:wrap;}
.opt{border:1.5px solid var(--hair);background:none;border-radius:12px;padding:9px 13px;font-size:12.5px;font-weight:600;
  color:var(--soft);cursor:pointer;transition:all .2s var(--ease);display:inline-flex;align-items:center;gap:6px;}
.opt:hover{border-color:var(--faint);color:var(--ink);}
.opt.on{border-color:transparent;color:#fff;}
.opt.on.g{background:var(--grad);}
.dtrow{display:flex;gap:9px;}
.field{flex:1;border:1.5px solid var(--hair);background:var(--bg);border-radius:13px;padding:11px 12px;font-size:13.5px;
  font-weight:600;color:var(--ink);outline:none;transition:border-color .2s;min-width:0;}
.field:focus{border-color:var(--tint);}
.sacts{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:0;background:var(--solid);padding-top:8px;}
.sbtn{flex:1;border:0;border-radius:16px;padding:14px;font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;
  cursor:pointer;transition:transform .2s var(--ease),opacity .2s;}
.sbtn:active{transform:scale(.97);}
.sbtn.cancel{background:var(--hover);color:var(--soft);}
.sbtn.save{background:var(--grad);color:#fff;box-shadow:0 10px 24px -8px var(--shadow);}
.sbtn.save:disabled{opacity:.4;cursor:default;box-shadow:none;}
.sbtn.wipe{background:rgba(255,59,92,.11);color:#FF3B5C;}
.rowbtn{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:14px;
  padding:13px 12px;cursor:pointer;text-align:left;transition:background .2s;}
.rowbtn:hover{background:var(--hover);}
.rowbtn .ri{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;flex-shrink:0;}
.rowtxt{font-size:14px;font-weight:600;}
.rowsub{font-size:11.5px;color:var(--soft);font-weight:500;margin-top:2px;}
.tog{width:46px;height:27px;border-radius:99px;background:var(--hair);border:0;cursor:pointer;position:relative;
  transition:background .25s var(--ease);flex-shrink:0;}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s var(--ease);}
.tog.on{background:#22C55E;}
.tog.on::after{transform:translateX(19px);}

/* ---------- search ---------- */
.searchwrap{position:fixed;inset:0;z-index:35;background:var(--bg);transform:translateY(100%);visibility:hidden;
  transition:transform .4s var(--ease);display:flex;flex-direction:column;}
.searchwrap.on{transform:none;visibility:visible;}
.sbar{padding:calc(16px + env(safe-area-inset-top)) 20px 12px;flex-shrink:0;}
.sbarin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--glass);
  border:1px solid var(--edge);border-radius:16px;padding:12px 14px;backdrop-filter:blur(18px);}
.sbarin input{flex:1;background:none;border:0;font-size:15.5px;font-weight:500;color:var(--ink);outline:none;min-width:0;}
.res{display:flex;gap:11px;padding:13px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);
  cursor:pointer;align-items:flex-start;transition:transform .2s var(--ease);width:100%;text-align:left;
  backdrop-filter:blur(14px);animation:slidein .3s var(--ease);}
.res:hover{transform:translateX(3px);}
.rdot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;flex-shrink:0;}
mark{background:rgba(255,196,0,.35);color:inherit;border-radius:3px;padding:0 2px;}

/* ---------- calendar ---------- */
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.calttl{font-family:'Outfit',sans-serif;font-weight:600;font-size:17px;letter-spacing:-.02em;flex:1;text-align:center;}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.dow span{text-align:center;font-size:10px;font-weight:700;color:var(--soft);letter-spacing:.03em;}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cday{aspect-ratio:1;border:0;background:none;border-radius:13px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--ink);
  transition:background .2s;position:relative;}
.cday:hover{background:var(--hover);}
.cday.mute{color:var(--faint);}
.cday.today{background:var(--hover);box-shadow:inset 0 0 0 1.5px var(--soft);}
.cday.sel{background:var(--ink);color:var(--bg);}
html[data-theme="dark"] .cday.sel{background:#ECEEF6;color:#0B0D14;}
.cdots{display:flex;gap:2.5px;height:5px;}
.cdot{width:5px;height:5px;border-radius:50%;}

/* ---------- focus timer ---------- */
.focus{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:30px 24px;text-align:center;}
.focus.on{display:flex;animation:fadein .4s var(--ease);}
.ring{position:relative;width:230px;height:230px;margin-bottom:26px;}
.ring svg{transform:rotate(-90deg);}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.clock{font-family:'Outfit',sans-serif;font-weight:700;font-size:47px;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;}
.ftask{font-size:15px;font-weight:600;max-width:320px;line-height:1.5;margin-bottom:6px;}
.fcat{font-size:11.5px;font-weight:700;color:var(--soft);letter-spacing:.05em;text-transform:uppercase;margin-bottom:22px;}
.fbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:360px;}
.fbtn{border:1.5px solid var(--hair);background:none;border-radius:14px;padding:13px 22px;font-family:'Outfit',sans-serif;
  font-weight:600;font-size:14.5px;cursor:pointer;transition:all .2s var(--ease);}
.fbtn:hover{border-color:var(--tint);color:var(--tint);}
.fbtn.pri{background:var(--grad);color:#fff;border-color:transparent;}
.celebrate{animation:cel .9s var(--ease);}
@keyframes cel{0%{transform:scale(1);}35%{transform:scale(1.14);}70%{transform:scale(.96);}100%{transform:scale(1);}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:100px;z-index:70;
  background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:11px 14px 11px 18px;border-radius:99px;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--ease);
  display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px -10px rgba(10,12,20,.45);max-width:92vw;}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto;}
.toast button{background:none;border:0;color:#7DB4FF;font-weight:700;font-size:12.5px;cursor:pointer;
  padding:2px 6px;border-radius:8px;white-space:nowrap;}
html[data-theme="dark"] .toast button{color:#2563EB;}

.mic.rec{color:#FF3B5C;animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.4;}}

/* ---------- install hint ---------- */
.install{display:none;align-items:flex-start;gap:11px;background:var(--glass);border:1px solid var(--edge);
  border-radius:20px;padding:13px 14px;margin-bottom:14px;backdrop-filter:blur(18px);
  box-shadow:0 8px 24px -16px rgba(20,22,37,.4);}
.install.on{display:flex;animation:slidein .4s var(--ease);}
.install .ri{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;flex-shrink:0;
  background:linear-gradient(135deg,#7C5CFC,#60C8FF);}
.install b{font-family:'Outfit',sans-serif;font-weight:600;font-size:13.5px;display:block;letter-spacing:-.01em;}
.install p{margin:3px 0 0;font-size:12px;color:var(--soft);line-height:1.5;}
.install .x{background:none;border:0;color:var(--faint);cursor:pointer;padding:3px;border-radius:8px;display:flex;flex-shrink:0;}
.install .x:hover{color:var(--ink);background:var(--hover);}
.instbtn{margin-top:9px;border:0;border-radius:11px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;
  background:linear-gradient(135deg,#7C5CFC,#60C8FF);color:#fff;}

@supports not ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))){
  :root{--glass:rgba(255,255,255,.9);}
  html[data-theme="dark"]{--glass:rgba(30,33,46,.95);}
}
/* ambient colour should sit behind the glass, not compete with it on a small screen */
@media (max-width:560px){
  .blob{filter:blur(86px);opacity:calc(var(--auraop) * .5);}
}
@media (max-width:360px){.grid{gap:11px;}.tile{padding:14px;border-radius:22px;}.hello{font-size:28px;}.tbig{font-size:26px;}}
html[data-reduce="1"] *{animation:none !important;transition:none !important;}
html[data-reduce="1"] .tile,html[data-reduce="1"] .note,html[data-reduce="1"] .res,
html[data-reduce="1"] .banner,html[data-reduce="1"] .blankico{opacity:1 !important;transform:none !important;}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
  .tile,.note,.res,.banner,.blankico{opacity:1 !important;transform:none !important;}
  .scrim.on{opacity:1 !important;}
}
@supports not (aspect-ratio:1/1){.tile{min-height:160px;}}

/* ---------------- categories ---------------- */
const CATS = [
  {id:'now',      name:'Do It Now',         icon:'now',      tint:'#FF5A6E', grad:'linear-gradient(135deg,#FF6B6B,#FF8E53)', shadow:'rgba(255,107,107,.55)', halo:'rgba(255,107,107,.18)', blank:'Nothing urgent right now. Enjoy it.'},

];
const CAT = {};
CATS.forEach(function(c){ CAT[c.id] = c; });

const PRIOS = [
  {id:'high',   name:'High',   color:'#FF3B5C'},
  {id:'medium', name:'Medium', color:'#FF9500'},
  {id:'normal', name:'Normal', color:'#22C55E'}
];
const PRIO = {}; PRIOS.forEach(function(p){ PRIO[p.id] = p; });

const TAGS = ['Office','Personal','Family','Health','Learning','Important'];
const REPEATS = [
  {id:'none',     name:'Once'},
  {id:'daily',    name:'Every day'},
  {id:'weekdays', name:'Weekdays'},
  {id:'weekly',   name:'Weekly'},
  {id:'monthly',  name:'Monthly'},
  {id:'custom',   name:'Custom days'},
  {id:'interval', name:'Every N days'}
];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const KEY = 'notes:app:v2';
const OLD_KEY = 'notes:six:v1';
const DATA_VERSION = 2;
const BIN_DAYS = 30;

/* ---------------- storage ---------------- */
var mem = null;
const Store = {
  get: async function(k){
    if (window.storage){ try { const r = await window.storage.get(k); if (r && r.value) return r.value; } catch(e){} }
    try { const v = localStorage.getItem(k); if (v) return v; } catch(e){}
    return k === KEY ? mem : null;
  },
  set: async function(k, v){
    mem = v;
    if (window.storage){ try { await window.storage.set(k, v); } catch(e){} }
    try { localStorage.setItem(k, v); return true; } catch(e){ return false; }
  }
};

/* ---------------- state ---------------- */
const DEFAULT_SETTINGS = {
  theme:'system', reduce:false, notify:true, firstDay:0, dateFormat:'dmy',
  highFirst:false, dashOpen:true
};
var S = { version: DATA_VERSION, notes: [], settings: Object.assign({}, DEFAULT_SETTINGS), meta: {} };

var view = { cat:null, filter:'all', tag:null, search:'', calMode:'month', calCursor:Date.now(), calSel:null };
var editingId = null, dragging = null, timer = null, lastDeleted = null, recog = null;

/* ---------------- utils ---------------- */
const uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); };
const esc = function(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
const $ = function(id){ return document.getElementById(id); };
const clamp = function(n,a,b){ return Math.max(a, Math.min(b, n)); };

const dk = function(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
};
const today = function(){ return dk(Date.now()); };
const sod = function(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const addDays = function(ts, n){ const d = new Date(ts); d.setDate(d.getDate()+n); return d.getTime(); };
const sameDay = function(a,b){ return dk(a) === dk(b); };

function fmtDate(ts){
  const d = new Date(ts), f = S.settings.dateFormat;
  const D = String(d.getDate()).padStart(2,'0'), M = String(d.getMonth()+1).padStart(2,'0'), Y = d.getFullYear();
  if (f === 'mdy') return M + '/' + D + '/' + Y;
  if (f === 'ymd') return Y + '-' + M + '-' + D;
  return D + '/' + M + '/' + Y;
}
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function stamp(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  if (m < 1) return 'Just now';
  if (m < 60) return m + ' min ago';
  if (m < 1440) return Math.floor(m/60) + ' hr ago';
  const d = Math.floor(m/1440);
  if (d === 1) return 'Yesterday';
  if (d < 7) return d + ' days ago';
  return fmtDate(ts);
}
/* date + time inputs <-> timestamp */
function toDateVal(ts){ return ts ? dk(ts) : ''; }
function toTimeVal(ts){
  if (!ts) return '';
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fromInputs(dateStr, timeStr){
  if (!dateStr) return null;
  const p = dateStr.split('-').map(Number);
  const t = (timeStr || '09:00').split(':').map(Number);
  const d = new Date(p[0], p[1]-1, p[2], t[0] || 0, t[1] || 0, 0, 0);
  return isNaN(d.getTime()) ? null : d.getTime();
}

/* due-date wording */
function dueInfo(n){
  const ts = n.dueDate || n.reminderTime;
  if (!ts) return null;
  const d = new Date(ts);
  const hasTime = !!n.reminderTime || d.getHours() !== 0 || d.getMinutes() !== 0;
  const t = today(), k = dk(ts);
  if (!n.done && k < t) return {cls:'over', text:'Overdue \u00b7 ' + fmtDate(ts)};
  if (k === t){
    /* a date with no clock time is due any time today, not overdue at 00:01 */
    if (!n.done && hasTime && ts < Date.now()) return {cls:'over', text:'Overdue \u00b7 ' + fmtTime(ts)};
    return {cls:'today', text:'Today' + (hasTime ? ' \u00b7 ' + fmtTime(ts) : '')};
  }
  if (k === dk(addDays(Date.now(),1))) return {cls:'due', text:'Tomorrow' + (hasTime ? ' \u00b7 ' + fmtTime(ts) : '')};
  return {cls:'due', text:fmtDate(ts) + (hasTime ? ' \u00b7 ' + fmtTime(ts) : '')};
}
function isOverdue(n){
  if (n.deletedAt) return false;
  const d = dueInfo(n);
  return !!d && d.cls === 'over';
}

/* ---------------- recurrence ---------------- */
function repMatches(rep, date){
  if (!rep || rep.type === 'none') return false;
  const d = new Date(date), dow = d.getDay();
  switch (rep.type){
    case 'daily':    return true;
    case 'weekdays': return dow >= 1 && dow <= 5;
    case 'weekly':   return rep.anchor ? new Date(rep.anchor).getDay() === dow : true;
    case 'monthly':  return rep.anchor ? new Date(rep.anchor).getDate() === d.getDate() : d.getDate() === 1;
    case 'custom':   return Array.isArray(rep.days) && rep.days.indexOf(dow) !== -1;
    case 'interval': {
      const every = Math.max(1, rep.every || 2);
      const base = sod(rep.anchor || Date.now());
      return Math.round((sod(date) - base) / 86400000) % every === 0;
    }
    default: return false;
  }
}
function nextOccurrence(fromTs, rep){
  if (!rep || rep.type === 'none') return null;
  const src = new Date(fromTs);
  for (var i = 1; i <= 400; i++){
    const d = new Date(fromTs);
    d.setDate(d.getDate() + i);
    d.setHours(src.getHours(), src.getMinutes(), 0, 0);
    if (repMatches(rep, d.getTime())) return d.getTime();
  }
  return null;
}
function repLabel(rep){
  if (!rep || rep.type === 'none') return '';
  if (rep.type === 'custom') return (rep.days || []).map(function(d){ return DOW[d]; }).join(' ') || 'Custom';
  if (rep.type === 'interval') return 'Every ' + (rep.every || 2) + ' days';
  const f = REPEATS.filter(function(r){ return r.id === rep.type; })[0];
  return f ? f.name : '';
}
function streakOf(n){
  const hist = n.history || [];
  if (!hist.length) return 0;
  const set = {}; hist.forEach(function(k){ set[k] = 1; });
  const rep = n.repeat && n.repeat.type !== 'none' ? n.repeat : {type:'daily'};
  var count = 0, cur = Date.now(), guard = 0;
  if (repMatches(rep, cur) && !set[dk(cur)]) cur = addDays(cur, -1);
  while (guard++ < 800){
    if (repMatches(rep, cur)){
      if (set[dk(cur)]) count++; else break;
    }
    cur = addDays(cur, -1);
  }
  return count;
}
function dailyDueToday(n){
  if (!n.repeat || n.repeat.type === 'none') return true;
  return repMatches(n.repeat, Date.now());
}

/* ---------------- selectors ---------------- */
/* Thoughts and Reminders are not tasks: a thought is something you had, a
   reminder is something that will nudge you. Neither belongs in "open tasks". */
const TASK_CATS = {now:1, park:1, tomorrow:1, daily:1};
function isTask(n){ return !!TASK_CATS[n.cat]; }

function live(){ return S.notes.filter(function(n){ return !n.deletedAt; }); }
function binned(){ return S.notes.filter(function(n){ return !!n.deletedAt; }).sort(function(a,b){ return b.deletedAt - a.deletedAt; }); }
function inCat(id){
  return live().filter(function(n){ return n.cat === id; }).sort(function(a,b){
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (S.settings.highFirst && !a.done && !b.done){
      const rank = {high:0, medium:1, normal:2};
      if (rank[a.priority] !== rank[b.priority]) return rank[a.priority] - rank[b.priority];
    }
    return (a.order || 0) - (b.order || 0);
  });
}
function passesFilter(n){
  const f = view.filter;
  if (view.tag && (n.tags || []).indexOf(view.tag) === -1) return false;
  if (f === 'pending') return !n.done;
  if (f === 'done') return n.done;
  if (f === 'over') return isOverdue(n);
  if (f === 'today'){ const ts = n.dueDate || n.reminderTime; return !!ts && dk(ts) === today(); }
  if (f === 'high') return n.priority === 'high';
  return true;
}
function counts(){
  const L = live();
  const t = today();
  var open = 0, dueToday = 0, over = 0, doneToday = 0, reminders = 0;
  L.forEach(function(n){
    if (!n.done && isTask(n)) open++;
    const ts = n.dueDate || n.reminderTime;
    if (ts && dk(ts) === t && !n.done) dueToday++;
    if (isOverdue(n)) over++;
    if (n.done && n.completedAt && dk(n.completedAt) === t) doneToday++;
    if (n.reminderTime && !n.done && n.reminderTime >= Date.now()) reminders++;
  });
  var streak = 0;
  L.filter(function(n){ return n.cat === 'daily'; }).forEach(function(n){ streak = Math.max(streak, streakOf(n)); });
  return {open:open, dueToday:dueToday, over:over, doneToday:doneToday, reminders:reminders, streak:streak};
}

}

/* ---------------- rollover (Plan for Tomorrow) ---------------- */
function rolloverCandidates(){
  const start = sod(Date.now());
  return live().filter(function(n){
    return n.cat === 'tomorrow' && !n.done && n.createdAt < start;
  });
}
function renderRolloverBanner(){
  const host = $('homeBanner');
  const list = rolloverCandidates();
  if (!list.length || S.meta.rolloverDay === today()){ host.innerHTML = ''; return; }
  const cat = CAT.tomorrow;
  host.innerHTML =
    '<div class="banner" style="--grad:' + cat.grad + ';--tint:' + cat.tint + '">' +
      '<div class="bttl">' + list.length + ' task' + (list.length > 1 ? 's' : '') + ' from earlier are still open</div>' +
      '<div class="bsub">They are sitting in Plan for Tomorrow. Nothing moves unless you say so.</div>' +
      '<div class="bacts">' +
        '<button class="bbtn pri" data-roll="all">Move all to Do It Now</button>' +
        '<button class="bbtn" data-roll="pick">Select tasks</button>' +
        '<button class="bbtn" data-roll="keep">Keep them here</button>' +
        '<button class="bbtn" data-roll="archive">Archive completed</button>' +
      '</div>' +
    '</div>';
}
function rollMove(ids){
  const base = maxOrder('now');
  ids.forEach(function(id, i){
    const n = byId(id); if (!n) return;
    n.cat = 'now'; n.order = base + i + 1; touch(n);
  });
  S.meta.rolloverDay = today();
  save(); renderHome(); if (view.cat) renderPanel();
  toast(ids.length + ' moved to Do It Now');
}
function handleRoll(action){
  if (action === 'keep'){ S.meta.rolloverDay = today(); save(); renderHome(); toast('Kept in Plan for Tomorrow'); return; }
  if (action === 'all'){ rollMove(rolloverCandidates().map(function(n){ return n.id; })); return; }
  if (action === 'archive'){
    const doneOnes = live().filter(function(n){ return n.cat === 'tomorrow' && n.done; });
    doneOnes.forEach(function(n){ n.deletedAt = Date.now(); });
    S.meta.rolloverDay = today();
    save(); renderHome(); if (view.cat) renderPanel();
    toast(doneOnes.length + ' completed task' + (doneOnes.length === 1 ? '' : 's') + ' archived');
    return;
  }
  if (action === 'pick') openRollPicker();
}
function openRollPicker(){
  const list = rolloverCandidates();
  const picked = {};
  openSheet(CAT.tomorrow,
    '<div class="shead">Move which tasks?</div>' +
    '<div id="rollList" style="display:flex;flex-direction:column;gap:6px;max-height:44dvh;overflow:auto">' +
      list.map(function(n){
        return '<button class="rowbtn" data-pick="' + n.id + '" style="border:1.5px solid var(--hair)">' +
          '<span class="tick" data-role="t"></span>' +
          '<span class="rowtxt" style="flex:1">' + esc(n.text.split('\n')[0].slice(0,80)) + '</span></button>';
      }).join('') +
    '</div>' +
    '<div class="sacts"><button class="sbtn cancel" data-close="1">Cancel</button>' +
    '<button class="sbtn save" id="rollGo">Move selected</button></div>',
    function(root){
      root.addEventListener('click', function(e){
        const b = e.target.closest('[data-pick]'); if (!b) return;
        const id = b.getAttribute('data-pick');
        picked[id] = !picked[id];
        b.querySelector('.tick').classList.toggle('on', !!picked[id]);
        b.querySelector('.tick').innerHTML = picked[id] ? SVG(P.check,13,3.2) : '';
      });
      $('rollGo').onclick = function(){
        const ids = Object.keys(picked).filter(function(k){ return picked[k]; });
        if (!ids.length){ toast('Nothing selected'); return; }
        closeSheet(); rollMove(ids);
      };
    });
}

/* ---------------- helpers ---------------- */
function byId(id){ return S.notes.filter(function(n){ return n.id === id; })[0]; }
function maxOrder(cat){
  var m = 0;
  live().forEach(function(n){ if (n.cat === cat) m = Math.max(m, n.order || 0); });
  return m;
}

/* ---------------- note card ---------------- */
function noteHTML(n, i, opts){
  opts = opts || {};
  const cat = CAT[n.cat];
  const d = dueInfo(n);

  const streak = n.cat === 'daily' && (n.repeat && n.repeat.type !== 'none') ? streakOf(n) : 0;
  var chips = '';
  if (n.priority !== 'normal')
    chips += '<span class="mchip pri" style="background:' + pri.color + '">' + pri.name + '</span>';
  if (d) chips += '<span class="mchip ' + d.cls + '">' + esc(d.text) + '</span>';

    chips += '<span class="mchip">' + esc(repLabel(n.repeat)) + '</span>';

/* ---------------- sheet plumbing ---------------- */
function openSheet(cat, html, after){
  /* replace the node so listeners from a previous render can never stack up */
  const stale = $('sheetIn');
  const reopening = $('sheet').classList.contains('on');
  const keepScroll = reopening ? stale.scrollTop : 0;
  const root = stale.cloneNode(false);
  stale.parentNode.replaceChild(root, stale);
  root.innerHTML = '<div class="handle"></div>' + html;
  setVars(root, cat || CAT.park);
  $('scrim').classList.add('on');
  $('sheet').classList.add('on');
  if (after) after(root);
  if (keepScroll) root.scrollTop = keepScroll;
}
function closeSheet(){
  $('scrim').classList.remove('on');
  $('sheet').classList.remove('on');
  if (recog){ try { recog.stop(); } catch(e){} recog = null; }
}

/* ---------------- auto numbering inside a note ---------------- */
function autoNumber(ta, e){
  if (e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.metaKey) return false;
  const pos = ta.selectionStart;
  const line = ta.value.slice(0, pos).split('\n').pop();
  const m = line.match(/^(\s*)(\d+)\.\s+(.*)$/);
  if (!m) return false;
  e.preventDefault();
  if (!m[3].trim()){
    const cut = pos - line.length;
    ta.value = ta.value.slice(0, cut) + ta.value.slice(pos);
    ta.selectionStart = ta.selectionEnd = cut;
    return true;
  }
  const ins = '\n' + m[1] + (parseInt(m[2],10) + 1) + '. ';
  ta.value = ta.value.slice(0,pos) + ins + ta.value.slice(pos);
  ta.selectionStart = ta.selectionEnd = pos + ins.length;
  return true;
}

/* ---------------- voice typing ---------------- */
function speechAvailable(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function toggleMic(btn, ta){
  if (recog){ try { recog.stop(); } catch(e){} recog = null; btn.classList.remove('rec'); return; }
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) return;
  try {
    recog = new Rec();
    recog.lang = navigator.language || 'en-IN';
    recog.interimResults = false;
    recog.continuous = true;
    var base = ta.value;
    recog.onresult = function(ev){
      var add = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++){
        if (ev.results[i].isFinal) add += ev.results[i][0].transcript;
      }
      if (!add) return;
      base = (base ? base.replace(/\s*$/,'') + ' ' : '') + add.trim();
      ta.value = base;
      ta.dispatchEvent(new Event('input'));
    };
    recog.onerror = function(){ btn.classList.remove('rec'); recog = null; toast('Voice input stopped'); };
    recog.onend = function(){ btn.classList.remove('rec'); recog = null; };
    recog.start();
    btn.classList.add('rec');
    toast('Listening\u2026 tap the mic to stop');
  } catch(e){ recog = null; btn.classList.remove('rec'); toast('Voice input is not available here'); }
}

/* ---------------- notifications ---------------- */
async function ensureNotify(){
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try { const r = await Notification.requestPermission(); return r === 'granted'; } catch(e){ return false; }
}
function notify(title, body){
  if (!S.settings.notify) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification(title, {body:body, tag:'notes-' + Date.now()}); } catch(e){}
}

      '</div>' +
      '<p class="hint">Ctrl/Cmd + Enter to save \u00b7 Enter continues a numbered list</p>' +

      (opts.quick ? '<div class="lbl">Category</div><div class="opts">' + CATS.map(function(c){
        return '<button class="opt' + (d.cat === c.id ? ' on g' : '') + '" data-c="' + c.id + '" style="--grad:' + c.grad + '">' +
          SVG(P[c.icon],14,2) + esc(c.name) + '</button>';
      }).join('') + '</div>' : '') +

      '<div class="lbl">Priority</div><div class="opts">' + PRIOS.map(function(p){
        return '<button class="opt' + (d.priority === p.id ? ' on' : '') + '" data-p="' + p.id + '"' +
          (d.priority === p.id ? ' style="background:' + p.color + '"' : '') + '>' +
          '<span class="pdot" style="background:' + (d.priority === p.id ? '#fff' : p.color) + '"></span>' + p.name + '</button>';
      }).join('') + '</div>' +

      '<div class="lbl">' + (d.cat === 'remind' ? 'Reminder' : 'Due date') + '</div>' +

        '<input class="field" type="date" id="cDate" value="' + esc(d.date) + '" aria-label="Date">' +
        '<input class="field" type="time" id="cTime" value="' + esc(d.time) + '" aria-label="Time">' +
        (d.date ? '<button class="opt" id="cClear" aria-label="Clear date">' + SVG(P.close,15) + '</button>' : '') +
      '</div>' +
      (d.date ? '<div class="rowbtn" style="padding-left:0;padding-right:0"><span class="ri" style="background:' + CAT.remind.grad + '">' + SVG(P.bell,17) + '</span>' +
        '<span style="flex:1"><span class="rowtxt">Remind me</span><span class="rowsub">Browser notification at this time</span></span>' +

      ((d.date || d.cat === 'daily') ?
        '<div class="lbl">Repeat</div><div class="opts">' + REPEATS.map(function(r){

        }).join('') + '</div>' +
        (d.repeat.type === 'custom' ? '<div class="opts" style="margin-top:8px">' + DOW.map(function(w,i){
          return '<button class="opt' + (d.repeat.days.indexOf(i) !== -1 ? ' on g' : '') + '" data-w="' + i + '">' + w + '</button>';
        }).join('') + '</div>' : '') +
        (d.repeat.type === 'interval' ? '<div class="dtrow" style="margin-top:8px"><input class="field" type="number" min="2" max="365" id="cEvery" value="' + (d.repeat.every || 2) + '" aria-label="Every N days"><span class="opt" style="pointer-events:none">days</span></div>' : '')
        : '') +

      '<div class="lbl">Tags</div><div class="opts">' + TAGS.map(function(t){
        return '<button class="opt' + (d.tags.indexOf(t) !== -1 ? ' on g' : '') + '" data-t="' + esc(t) + '">#' + esc(t) + '</button>';
      }).join('') + '</div>' +

      '<div class="sacts"><button class="sbtn cancel" data-close="1">Cancel</button>' +
      '<button class="sbtn save" id="cSave"' + (d.text.trim() ? '' : ' disabled') + '>' + (existing ? 'Save changes' : 'Add note') + '</button></div>';
  }

  function paint(focusText){
    openSheet(CAT[d.cat], body(), function(root){
      const ta = $('cText'), btn = $('cSave');
      const grow = function(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; };
      ta.addEventListener('input', function(){ d.text = ta.value; grow(); btn.disabled = !ta.value.trim(); });
      ta.addEventListener('keydown', function(e){
        if (autoNumber(ta, e)){ d.text = ta.value; grow(); btn.disabled = !ta.value.trim(); return; }
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); commit(); }
      });
      grow();
      if (focusText){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }

      const mic = $('cMic');
      if (mic) mic.onclick = function(){ toggleMic(mic, ta); };

      const dateEl = $('cDate'), timeEl = $('cTime');
      dateEl.onchange = function(){ d.date = dateEl.value; if (d.date && !d.time) d.time = d.cat === 'remind' ? '09:00' : ''; paint(false); };
      timeEl.onchange = function(){ d.time = timeEl.value; };
      const cl = $('cClear');
      if (cl) cl.onclick = function(){ d.date = ''; d.time = ''; d.remind = false; d.repeat.type = d.cat === 'daily' ? d.repeat.type : 'none'; paint(false); };
      const rm = $('cRemind');
      if (rm) rm.onclick = function(){ d.remind = !d.remind; paint(false); };
      const ev = $('cEvery');
      if (ev) ev.onchange = function(){ d.repeat.every = clamp(parseInt(ev.value,10) || 2, 2, 365); };

      root.addEventListener('click', function(e){
        const c = e.target.closest('[data-c]'); if (c){ d.cat = c.getAttribute('data-c'); if (d.cat==='remind' && !d.time) d.time='09:00'; paint(false); return; }
        const p = e.target.closest('[data-p]'); if (p){ d.priority = p.getAttribute('data-p'); paint(false); return; }
        const r = e.target.closest('[data-r]'); if (r){ d.repeat.type = r.getAttribute('data-r'); d.repeat.anchor = Date.now(); paint(false); return; }
        const w = e.target.closest('[data-w]'); if (w){
          const i = parseInt(w.getAttribute('data-w'),10);
          const k = d.repeat.days.indexOf(i);
          if (k === -1) d.repeat.days.push(i); else d.repeat.days.splice(k,1);
          paint(false); return;
        }
        const t = e.target.closest('[data-t]'); if (t){
          const tag = t.getAttribute('data-t');
          const k = d.tags.indexOf(tag);
          if (k === -1) d.tags.push(tag); else d.tags.splice(k,1);
          paint(false); return;
        }
      });
      btn.onclick = commit;
    });
  }

  async function commit(){
    const text = ($('cText') ? $('cText').value : d.text).trim();
    if (!text) return;
    const wantRemind = !!d.date && (d.remind || d.cat === 'remind');
    const ts = fromInputs(d.date, d.time || (wantRemind ? '09:00' : '00:00'));
    const rep = d.repeat.type === 'none' ? null : JSON.parse(JSON.stringify(d.repeat));
    if (rep && !rep.anchor) rep.anchor = ts || Date.now();

    if (existing){
      existing.text = text; existing.priority = d.priority; existing.tags = d.tags.slice();
      existing.dueDate = (d.date && !wantRemind) ? ts : null;
      existing.reminderTime = wantRemind ? ts : null;
      existing.repeat = rep; existing.lastFired = null;
      if (existing.cat !== d.cat){ existing.cat = d.cat; existing.order = maxOrder(d.cat) + 1; }
      touch(existing);
      toast('Note updated');
    } else {
      S.notes.push({
        id:uid(), cat:d.cat, text:text, createdAt:Date.now(), updatedAt:Date.now(),
        done:false, completedAt:null, priority:d.priority,
        dueDate:(d.date && !wantRemind) ? ts : null,
        reminderTime: wantRemind ? ts : null,
        repeat:rep, tags:d.tags.slice(), order:maxOrder(d.cat) + 1,
        pinned:false, deletedAt:null, history:[], lastFired:null
      });
      toast('Added to ' + CAT[d.cat].name);
    }
    if (wantRemind) await ensureNotify();
    save(); closeSheet();
    if (view.cat) renderPanel();
    renderHome();
    if (!$('searchWrap').classList.contains('on')) {} else runSearch();
  }

  paint(true);
}

/* ---------------- drag & drop ---------------- */
function commitOrder(){
  const ids = Array.prototype.slice.call($('pList').querySelectorAll('.note')).map(function(el){ return el.getAttribute('data-id'); });
  ids.forEach(function(id, i){ const n = byId(id); if (n) n.order = i + 1; });
  save(); renderPanel();
}
function initDrag(){
  $('pList').addEventListener('pointerdown', function(e){
    const g = e.target.closest('[data-drag]'); if (!g) return;
    const li = g.closest('.note'); if (!li) return;
    e.preventDefault();
    const list = $('pList');
    var startY = e.clientY;
    li.classList.add('dragging');
    try { g.setPointerCapture(e.pointerId); } catch(err){}

    function onMove(ev){
      li.style.transform = 'translateY(' + (ev.clientY - startY) + 'px)';
      const sibs = Array.prototype.slice.call(list.children).filter(function(x){ return x !== li && x.classList.contains('note'); });
      var target = null;
      for (var i = 0; i < sibs.length; i++){
        const r = sibs[i].getBoundingClientRect();
        if (ev.clientY < r.top + r.height / 2){ target = sibs[i]; break; }
      }
      if (target !== li.nextElementSibling){
        list.insertBefore(li, target);
        startY = ev.clientY;
        li.style.transform = 'translateY(0px)';
      }
    }
    function onUp(ev){
      try { g.releasePointerCapture(ev.pointerId); } catch(err){}
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      li.classList.remove('dragging');
      li.style.transform = '';
      commitOrder();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

/* ---------------- focus timer ---------------- */
function pickFocus(id){
  const n = byId(id); if (!n) return;
  openSheet(CAT.now,
    '<div class="shead">Focus on this</div>' +
    '<p class="hint" style="margin:0 2px 14px">' + esc(n.text.split('\n')[0].slice(0,90)) + '</p>' +

      return '<button class="opt" data-f="' + m + '">' + m + ' min</button>';
    }).join('') + '</div>' +
    '<div class="lbl">Custom</div>' +
    '<div class="dtrow"><input class="field" type="number" id="fCustom" min="1" max="240" placeholder="Minutes" aria-label="Custom minutes">' +
    '<button class="sbtn save" id="fGo" style="flex:0 0 auto;padding:11px 20px">Start</button></div>' +
    '<div class="sacts"><button class="sbtn cancel" data-close="1">Cancel</button></div>',
    function(root){
      root.addEventListener('click', function(e){
        const b = e.target.closest('[data-f]'); if (!b) return;
        closeSheet(); startFocus(id, parseInt(b.getAttribute('data-f'),10));
      });
      $('fGo').onclick = function(){
        const v = clamp(parseInt($('fCustom').value,10) || 25, 1, 240);
        closeSheet(); startFocus(id, v);
      };
    });
}
function startFocus(id, mins){
  if (timer && timer.tick) clearInterval(timer.tick);
  timer = {id:id, total:mins*60, left:mins*60, running:true, tick:null};
  $('focusView').classList.add('on');
  $('focusView').setAttribute('aria-hidden','false');
  setVars($('focusView'), CAT.now);
  drawFocus();
  timer.tick = setInterval(function(){
    if (!timer || !timer.running) return;
    timer.left--;
    if (timer.left <= 0){ finishFocus(true); return; }
    drawFocus();
  }, 1000);
}
function drawFocus(){
  if (!timer) return;
  const n = byId(timer.id);
  const pct = timer.total ? timer.left / timer.total : 0;
  const R = 100, C = 2 * Math.PI * R;
  $('focusRing').innerHTML =
    '<svg width="230" height="230" viewBox="0 0 230 230">' +
      '<circle cx="115" cy="115" r="' + R + '" stroke="var(--hair)" stroke-width="12" fill="none"/>' +
      '<circle cx="115" cy="115" r="' + R + '" stroke="url(#fg)" stroke-width="12" fill="none" stroke-linecap="round" ' +
      'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct)) + '" style="transition:stroke-dashoffset 1s linear"/>' +
      '<defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#FF8E53"/></linearGradient></defs>' +
    '</svg>' +
    '<div class="ringtxt"><div class="clock">' +
      String(Math.floor(timer.left/60)).padStart(2,'0') + ':' + String(timer.left%60).padStart(2,'0') +
    '</div></div>';
  $('focusTask').textContent = n ? n.text.split('\n')[0] : '';
  $('focusCat').textContent = timer.running ? 'Focusing' : 'Paused';
  $('focusBtns').innerHTML =
    '<button class="fbtn" data-fa="toggle">' + (timer.running ? 'Pause' : 'Resume') + '</button>' +
    '<button class="fbtn pri" data-fa="finish">Finish task</button>' +
    '<button class="fbtn" data-fa="cancel">Cancel</button>';
}
function finishFocus(auto){
  if (!timer) return;
  const id = timer.id;
  clearInterval(timer.tick);
  const ring = $('focusRing');
  ring.classList.add('celebrate');
  setTimeout(function(){ ring.classList.remove('celebrate'); }, 950);
  const n = byId(id);
  if (auto){
    notify('Focus session complete', n ? n.text.split('\n')[0].slice(0,80) : 'Time is up');
    toast('Focus session complete');
    timer = null;
    setTimeout(closeFocus, 900);
  } else {
    if (n && !n.done) setDone(n, true);
    timer = null;
    closeFocus();
    toast('Task completed');
  }
}
function closeFocus(){
  if (timer && timer.tick) clearInterval(timer.tick);
  timer = null;
  $('focusView').classList.remove('on');
  $('focusView').setAttribute('aria-hidden','true');
  if (view.cat) renderPanel();
  renderHome();
}

/* ---------------- completion (with recurrence history) ---------------- */
function setDone(n, val){
  const t = today();
  n.done = !!val;
  if (val){
    n.completedAt = Date.now();
    if (n.repeat && n.repeat.type !== 'none'){
      n.history = n.history || [];
      if (n.history.indexOf(t) === -1) n.history.push(t);
    }
  } else {
    n.completedAt = null;
    if (n.history) n.history = n.history.filter(function(k){ return k !== t; });
  }
  touch(n);
  save();
}
function resetRecurring(){
  var changed = false;
  live().forEach(function(n){
    if (!n.repeat || n.repeat.type === 'none') return;
    if (n.done && (!n.completedAt || dk(n.completedAt) !== today())){
      n.done = false; n.completedAt = null; changed = true;
    }
  });
  if (changed) save();
}

function hl(text, q){
  const safe = esc(text);
  if (!q) return safe;
  const eq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp('(' + eq + ')', 'ig'), '<mark>$1</mark>');
}
const STAT_VIEWS = {

  today:   {title:'Due today',    blank:'Nothing is scheduled for today.',

  over:    {title:'Overdue',      blank:'Nothing is overdue. Good.',

function shiftCal(dir){

function renderCal(){
  const mode = view.calMode;
  const cur = new Date(view.calCursor);
  $('calSub').textContent = datedNotes().length + ' scheduled note' + (datedNotes().length === 1 ? '' : 's');

  var head = '<div class="opts" style="margin-bottom:14px">' + ['day','week','month'].map(function(m){
    return '<button class="opt' + (mode === m ? ' on g' : '') + '" data-cm="' + m + '">' + m.charAt(0).toUpperCase() + m.slice(1) + '</button>';
  }).join('') + '</div>';

  var title = '';
  if (mode === 'month') title = cur.toLocaleDateString([], {month:'long', year:'numeric'});
  else if (mode === 'week'){
    const s = weekStart(cur.getTime());
    title = fmtDate(s) + ' \u2013 ' + fmtDate(addDays(s,6));
  } else title = cur.toLocaleDateString([], {weekday:'long', day:'numeric', month:'long'});

  head += '<div class="calnav"><button class="ico" data-cn="-1" aria-label="Previous">' + SVG(P.left,18) + '</button>' +
    '<span class="calttl">' + esc(title) + '</span>' +
    '<button class="ico" data-cn="1" aria-label="Next">' + SVG(P.right,18) + '</button></div>';

  var body = '';
  if (mode === 'day'){
    body = dayListHTML(cur.getTime());
  } else {
    const start = mode === 'week' ? weekStart(cur.getTime()) : monthGridStart(cur);
    const n = mode === 'week' ? 7 : 42;
    const dows = [];
    for (var i = 0; i < 7; i++) dows.push(DOW[(S.settings.firstDay + i) % 7]);
    body = '<div class="dow">' + dows.map(function(d){ return '<span>' + d + '</span>'; }).join('') + '</div><div class="cgrid">';
    for (var j = 0; j < n; j++){
      const ts = addDays(start, j), d = new Date(ts);
      const items = notesOn(ts);
      const dots = {};
      items.forEach(function(it){ dots[it.cat] = 1; });
      const isMute = mode === 'month' && d.getMonth() !== cur.getMonth();
      body += '<button class="cday' + (isMute ? ' mute' : '') + (dk(ts) === today() ? ' today' : '') +
        (view.calSel && dk(ts) === dk(view.calSel) ? ' sel' : '') + '" data-cd="' + ts + '">' +
        d.getDate() + '<span class="cdots">' + Object.keys(dots).slice(0,4).map(function(c){
          return '<span class="cdot" style="background:' + CAT[c].tint + '"></span>';
        }).join('') + '</span></button>';
    }
    body += '</div>';
    if (view.calSel) body += '<div style="margin-top:16px">' + dayListHTML(view.calSel) + '</div>';
  }
  $('calBody').innerHTML = head + body;
}
function weekStart(ts){
  const d = new Date(sod(ts));
  const diff = (d.getDay() - S.settings.firstDay + 7) % 7;
  d.setDate(d.getDate() - diff);
  return d.getTime();
}
function monthGridStart(cur){
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  return weekStart(first.getTime());
}

function doExport(){
  const payload = {
    app:'notes', dataVersion:DATA_VERSION, exportedAt:Date.now(),
    categories:CATS.map(function(c){ return {id:c.id, name:c.name}; }),
    settings:S.settings, meta:S.meta, notes:S.notes
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}));
  a.download = 'notes-backup-' + today() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  closeSheet(); toast('Backup exported');
}
function normalise(raw){
  if (!raw || typeof raw !== 'object') return null;
  const text = typeof raw.text === 'string' ? raw.text : '';
  if (!text.trim()) return null;
  const cat = CAT[raw.cat] ? raw.cat : 'thoughts';
  const prio = PRIO[raw.priority] ? raw.priority : 'normal';
  var rep = null;
  if (raw.repeat && typeof raw.repeat === 'object' && typeof raw.repeat.type === 'string'){
    const ok = REPEATS.filter(function(r){ return r.id === raw.repeat.type; }).length > 0;
    if (ok && raw.repeat.type !== 'none'){
      rep = {
        type: raw.repeat.type,
        days: Array.isArray(raw.repeat.days) ? raw.repeat.days.filter(function(d){ return Number.isInteger(d) && d >= 0 && d <= 6; }) : [],
        every: clamp(parseInt(raw.repeat.every,10) || 2, 2, 365),
        anchor: Number(raw.repeat.anchor) || Date.now()
      };
    }
  }
  const num = function(v){ const n = Number(v); return Number.isFinite(n) && n > 0 ? n : null; };
  return {
    id: typeof raw.id === 'string' && raw.id ? raw.id : uid(),
    cat: cat,
    text: text.slice(0, 20000),
    createdAt: num(raw.createdAt) || Date.now(),
    updatedAt: num(raw.updatedAt) || num(raw.createdAt) || Date.now(),
    done: raw.done === true,
    completedAt: num(raw.completedAt),
    priority: prio,
    dueDate: num(raw.dueDate),
    reminderTime: num(raw.reminderTime),
    repeat: rep,
    tags: Array.isArray(raw.tags) ? raw.tags.filter(function(t){ return typeof t === 'string'; }).map(function(t){ return t.slice(0,24); }).slice(0,10) : [],
    order: Number.isFinite(Number(raw.order)) ? Number(raw.order) : 0,
    pinned: raw.pinned === true,
    deletedAt: num(raw.deletedAt),
    history: Array.isArray(raw.history) ? raw.history.filter(function(h){ return typeof h === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(h); }).slice(-800) : [],
    lastFired: num(raw.lastFired)
  };
}
function doImport(file){
  const r = new FileReader();
  r.onload = function(){
    var parsed;
    try { parsed = JSON.parse(r.result); } catch(e){ toast('That file is not valid JSON'); return; }
    const rawNotes = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.notes) ? parsed.notes : null);
    if (!rawNotes){ toast('That file is not a notes backup'); return; }
    const have = {}; S.notes.forEach(function(n){ have[n.id] = 1; });
    var added = 0;
    rawNotes.forEach(function(raw){
      const n = normalise(raw);
      if (!n || have[n.id]) return;
      have[n.id] = 1; S.notes.push(n); added++;
    });
    if (parsed && parsed.settings && typeof parsed.settings === 'object'){
      Object.keys(DEFAULT_SETTINGS).forEach(function(k){
        const v = parsed.settings[k];
        if (typeof v === typeof DEFAULT_SETTINGS[k]) S.settings[k] = v;
      });
    }
    applyTheme(); save(); closeSheet();
    if (view.cat) renderPanel();
    renderBin(); renderHome();
    toast(added + ' note' + (added === 1 ? '' : 's') + ' imported');
  };
  r.onerror = function(){ toast('Could not read that file'); };
  r.readAsText(file);
}

/* ---------------- reminders engine ---------------- */
var lastDayCheck = today();
function reminderTick(quiet){
  const now = Date.now();
  var changed = false, fired = [];
  live().forEach(function(n){
    if (!n.reminderTime || n.done) return;
    if (n.reminderTime > now) return;
    if (n.lastFired === n.reminderTime) return;
    n.lastFired = n.reminderTime;
    fired.push(n);
    if (n.repeat && n.repeat.type !== 'none'){
      const next = nextOccurrence(n.reminderTime, n.repeat);
      if (next){ n.reminderTime = next; n.lastFired = null; }
    }
    changed = true;
  });
  if (changed) save();
  if (fired.length){
    if (!quiet) fired.forEach(function(n){ notify('Reminder \u00b7 ' + CAT[n.cat].name, n.text.split('\n')[0].slice(0,120)); });
    if (fired.length === 1) showDueSheet(fired[0]);
    else showMissedSheet(fired);
    renderHome();
    if (view.cat) renderPanel();
  }
  if (today() !== lastDayCheck){
    lastDayCheck = today();
    resetRecurring();
    renderHome();
    if (view.cat) renderPanel();
  }
}

/* ---------------- migration + boot ---------------- */
function normaliseAll(){
  S.notes = (S.notes || []).map(normalise).filter(Boolean);
  const seen = {};
  S.notes = S.notes.filter(function(n){ if (seen[n.id]) return false; seen[n.id] = 1; return true; });
  const byCat = {};
  S.notes.forEach(function(n){
    if (!n.order){ byCat[n.cat] = (byCat[n.cat] || 0) + 1; n.order = byCat[n.cat]; }
  });
  S.settings = Object.assign({}, DEFAULT_SETTINGS, S.settings || {});
  S.meta = S.meta || {};
}
async function boot(){
  var loaded = null;
  const raw = await Store.get(KEY);
  if (raw){ try { loaded = JSON.parse(raw); } catch(e){ loaded = null; } }

  if (loaded && typeof loaded === 'object' && Array.isArray(loaded.notes)){
    S = loaded;
  } else {
    /* migrate from the previous version of this app */
    const old = await Store.get(OLD_KEY);
    if (old){
      try {
        const arr = JSON.parse(old);
        if (Array.isArray(arr)) S.notes = arr;
      } catch(e){}
    }
  }
  normaliseAll();
  purgeOld();
  resetRecurring();
  applyTheme();
  buildAura();

  $('dateLine').textContent = new Date().toLocaleDateString([], {weekday:'long', day:'numeric', month:'long'});
  $('btnSearch').innerHTML = SVG(P.search,18);
  $('btnCal').innerHTML    = SVG(P.cal,18);
  $('btnSet').innerHTML    = SVG(P.gear,18);
  $('btnBack').innerHTML   = SVG(P.back,19,2.4);
  $('calBack').innerHTML   = SVG(P.back,19,2.4);
  $('binBack').innerHTML   = SVG(P.back,19,2.4);
  $('chev').innerHTML      = SVG(P.chev,17);
  $('fabIcon').innerHTML   = SVG(P.plus,19,2.6);
  $('sIcon').innerHTML     = SVG(P.search,17);
  $('sClose').innerHTML    = SVG(P.close,17);

  renderHome();
  showQuickFab();
  initDrag();
  save();
  setInterval(function(){ reminderTick(false); }, 20000);
  /* catch up quietly on anything that came due while the app was closed */
  setTimeout(function(){ reminderTick(true); }, 1200);
}

function showQuickFab(){
  const fab = $('fab');
  setVars(fab, {grad:'linear-gradient(135deg,#7C5CFC,#60C8FF)', tint:'#7C5CFC', shadow:'rgba(124,92,252,.5)', halo:'rgba(124,92,252,.18)'});
  $('fabText').textContent = 'Quick note';
  fab.classList.add('on');
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  if (e.target.closest('[data-close]')){ closeSheet(); return; }

  const tile = e.target.closest('.tile');
  if (tile){ openCat(tile.getAttribute('data-cat')); return; }

  const stat = e.target.closest('[data-stat]');
  if (stat){ openStat(stat.getAttribute('data-stat')); return; }

  const roll = e.target.closest('[data-roll]');
  if (roll){ handleRoll(roll.getAttribute('data-roll')); return; }

  const f = e.target.closest('[data-filter]');
  if (f){ view.filter = f.getAttribute('data-filter'); view.tag = null; renderPanel(); return; }
  const tf = e.target.closest('[data-tagf]');
  if (tf){ const t = tf.getAttribute('data-tagf'); view.tag = view.tag === t ? null : t; renderPanel(); return; }

  const hit = e.target.closest('[data-hit]');
  if (hit){ jumpTo(hit.getAttribute('data-hit')); return; }

  const cm = e.target.closest('[data-cm]');
  if (cm){ view.calMode = cm.getAttribute('data-cm'); renderCal(); return; }
  const cn = e.target.closest('[data-cn]');
  if (cn){ shiftCal(parseInt(cn.getAttribute('data-cn'),10)); return; }
  const cd = e.target.closest('[data-cd]');
  if (cd){ view.calSel = parseInt(cd.getAttribute('data-cd'),10); if (view.calMode === 'day') view.calCursor = view.calSel; renderCal(); return; }

  const fa = e.target.closest('[data-fa]');
  if (fa){
    const a = fa.getAttribute('data-fa');
    if (a === 'toggle'){ if (timer){ timer.running = !timer.running; drawFocus(); } }
    else if (a === 'finish') finishFocus(false);
    else if (a === 'cancel'){ closeFocus(); toast('Focus session cancelled'); }
    return;
  }

  const binBtn = e.target.closest('[data-bin]');
  if (binBtn){
    const li = binBtn.closest('.note'), id = li.getAttribute('data-id'), n = byId(id);
    if (!n) return;
    if (binBtn.getAttribute('data-bin') === 'restore'){
      n.deletedAt = null; n.order = maxOrder(n.cat) + 1; save(); renderBin(); renderHome(); toast('Restored to ' + CAT[n.cat].name);
    } else {
      S.notes = S.notes.filter(function(x){ return x.id !== id; });
      save(); renderBin(); toast('Deleted permanently');
    }
    return;
  }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const li = act.closest('.note'); if (!li) return;
  const id = li.getAttribute('data-id'), n = byId(id); if (!n) return;
  const a = act.getAttribute('data-act');

  if (a === 'jump'){ closeCal(); jumpTo(id); return; }
  if (a === 'tick'){ setDone(n, !n.done); renderPanel(); renderHome(); return; }
  if (a === 'del'){ softDelete(id); return; }
  if (a === 'menu'){ openMenu(id); return; }
  if (a === 'focus'){ pickFocus(id); return; }
  if (a === 'edit') startInlineEdit(li, id);
});

function startInlineEdit(li, id){
  if (editingId) return;
  editingId = id;
  const n = byId(id);
  const p = li.querySelector('.ntext');
  const ta = document.createElement('textarea');
  ta.className = 'nedit'; ta.value = n.text;
  ta.setAttribute('aria-label','Edit note text');
  p.replaceWith(ta);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.style.height = Math.max(ta.scrollHeight, 82) + 'px';
  const finish = function(){
    const v = ta.value.trim(); editingId = null;
    if (v && v !== n.text){ n.text = v; touch(n); save(); }
    renderPanel();
  };
  ta.onblur = finish;
  ta.onkeydown = function(e){
    if (autoNumber(ta, e)){ ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight,82) + 'px'; return; }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); ta.blur(); }
    if (e.key === 'Escape'){ ta.onblur = null; editingId = null; renderPanel(); }
  };
}

$('dashBar').onclick = function(){ S.settings.dashOpen = !S.settings.dashOpen; save(); renderHome(); };
$('btnSearch').onclick = function(){ openSearch(); };
$('btnCal').onclick = function(){ openCal(); };
$('btnSet').onclick = function(){ openSettings(); };
$('sClose').onclick = function(){ history.state && history.state.p === 'search' ? history.back() : closeSearch(); };
$('sInput').addEventListener('input', function(e){ view.search = e.target.value; view.stat = null; runSearch(); });
$('btnBack').onclick = function(){ history.state && history.state.p === 'cat' ? history.back() : closeCat(); };
$('calBack').onclick = function(){ history.state && history.state.p === 'cal' ? history.back() : closeCal(); };
$('binBack').onclick = function(){ history.state && history.state.p === 'bin' ? history.back() : closeBin(); };
$('scrim').onclick = closeSheet;
$('fab').onclick = function(){ view.cat ? openCompose({cat:view.cat}) : openCompose({quick:true}); };
$('fileIn').onchange = function(e){ const f = e.target.files[0]; if (f) doImport(f); e.target.value = ''; };

function closeBin(){ $('binPanel').classList.remove('on'); $('binPanel').setAttribute('aria-hidden','true'); showQuickFab(); }

window.addEventListener('popstate', function(){
  if ($('sheet').classList.contains('on')) closeSheet();
  if ($('binPanel').classList.contains('on')) closeBin();
  else if ($('calPanel').classList.contains('on')) closeCal();
  else if ($('searchWrap').classList.contains('on')) closeSearch();
  else if (view.cat) closeCat();
  showQuickFab();
});

document.addEventListener('keydown', function(e){
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  const mod = e.ctrlKey || e.metaKey;

  if (mod && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); openSearch(); return; }
  if (mod && (e.key === 'n' || e.key === 'N')){ e.preventDefault(); openCompose(view.cat ? {cat:view.cat} : {quick:true}); return; }
  if (e.key === 'Escape'){
    if ($('sheet').classList.contains('on')) closeSheet();
    else if ($('focusView').classList.contains('on')) closeFocus();
    else if ($('binPanel').classList.contains('on')) closeBin();
    else if ($('calPanel').classList.contains('on')) closeCal();
    else if ($('searchWrap').classList.contains('on')) closeSearch();
    else if (view.cat) closeCat();
    showQuickFab();
    return;
  }
  if (typing) return;
});

if (window.matchMedia){
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
      if (S.settings.theme === 'system') applyTheme();
    });
  } catch(e){}
}

/* ================= PWA ================= */
const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var deferredPrompt = null;

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', function(){
          if (sw.state === 'installed' && navigator.serviceWorker.controller){
            toast('A new version is ready', 'Reload', function(){
              sw.postMessage('skip-waiting');
              setTimeout(function(){ location.reload(); }, 200);
            });
          }
        });
      });
    }).catch(function(){ /* offline support simply will not be available */ });
  });
}

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  showInstallHint('android');
});

function showInstallHint(kind){
  if (standalone) return;
  if (S.meta.installHidden) return;
  const box = $('installHint');
  $('instIcon').innerHTML = SVG(P.down,16);
  $('instClose').innerHTML = SVG(P.close,16);
  if (kind === 'android'){
    $('instTitle').textContent = 'Install Notes';
    $('instText').textContent = 'Add it to your home screen to open it like a normal app, even offline.';
    $('instBtn').hidden = false;
  } else {
    $('instTitle').textContent = 'Add Notes to your Home Screen';
    $('instText').textContent = 'In Safari tap the Share button, then "Add to Home Screen". Reminders and offline use only work once it is installed.';
    $('instBtn').hidden = true;
  }
  box.classList.add('on');
}
$('instBtn').onclick = async function(){
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch(e){}
  deferredPrompt = null;
  $('installHint').classList.remove('on');
};
$('instClose').onclick = function(){
  $('installHint').classList.remove('on');
  S.meta.installHidden = true; save();
};

/* launch shortcuts: notes.html?new=1 or ?cat=now */
function handleLaunchParams(){
  var q;
  try { q = new URLSearchParams(location.search); } catch(e){ return; }
  const cat = q.get('cat');
  if (cat && CAT[cat]){ openCat(cat); return; }
  if (q.get('new')) setTimeout(function(){ openCompose({quick:true}); }, 300);
}

boot().then(function(){
  handleLaunchParams();
  if (isIOS && !standalone) setTimeout(function(){ showInstallHint('ios'); }, 1200);
});
</script>
